%YAML 1.2
---
$id: http://devicetree.org/schemas/remoteproc/sophgo,cv1800b-c906l.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sophgo CV18XX/SG200X C906L remote processor

maintainers:
  - Junhui Liu <junhui.liu@pigmoral.tech>
  - João Paulo Gonçalves <jpaulo.silvagoncalves@gmail.com>

description:
  The Sophgo CV18XX/SG200X SoCs integrate a secondary T-Head C906 core, known
  as the C906L (Little Core), alongside the main processor (Big Core). Unlike
  the main processor, the C906L has no MMU, and it usually runs an RTOS or
  bare-metal applications.

properties:
  compatible:
    const: sophgo,cv1800b-c906l

  clocks:
    items:
      - description: C906L core clock
      - description: eFuse clock, required for SEC_SYS register access
      - description: eFuse APB clock, required for SEC_SYS register access

  firmware-name:
    maxItems: 1

  mboxes:
    description:
      Required only for RPMsg/virtio communication with the remote processor.
    items:
      - description: Channel used to send messages to the C906L
      - description: Channel used to receive messages from the C906L

  mbox-names:
    items:
      - const: tx
      - const: rx

  memory-region:
    description:
      Reserved memory regions used by the C906L.
    items:
      - description: DMA pool used for the vrings and virtio buffers.
      - description: Firmware region.

  resets:
    maxItems: 1

  sophgo,sec-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the SEC_SYS system controller, used to enable the C906L and
      set its boot address.

required:
  - compatible
  - clocks
  - memory-region
  - resets
  - sophgo,sec-syscon

dependencies:
  mbox-names: [ mboxes ]

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/sophgo,cv1800.h>

    reserved-memory {
        #address-cells = <1>;
        #size-cells = <1>;
        ranges;

        c906l_dma: memory@9fd00000 {
            compatible = "shared-dma-pool";
            reg = <0x9fd00000 0x100000>;
            no-map;
        };

        c906l_fw: memory@9fe00000 {
            reg = <0x9fe00000 0x200000>;
            no-map;
        };
    };

    remoteproc {
        compatible = "sophgo,cv1800b-c906l";
        clocks = <&clk CLK_C906_1>, <&clk CLK_EFUSE>, <&clk CLK_APB_EFUSE>;
        firmware-name = "c906l-fw.elf";
        mboxes = <&mbox 0 2>, <&mbox 1 1>;
        mbox-names = "tx", "rx";
        memory-region = <&c906l_dma>, <&c906l_fw>;
        resets = <&rst 294>; /* RST_CPUSYS2 */
        sophgo,sec-syscon = <&sec_sys>;
    };
